domain: vacuum
service: set_fan_speed
name: Set fan speed
description: Sets the fan speed of the vacuum cleaner.
fields:
  fan_speed:
    required: true
    name: Fan speed
    description: Fan speed. The value depends on the integration. Some integrations
      have speed steps, like 'medium'. Some use a percentage, between 0 and 100.
    selector:
      text:
        multiline: false
        multiple: false
target:
  entity:
  - domain:
    - vacuum
handler: builtin:service.not_implemented
supports_response: false
