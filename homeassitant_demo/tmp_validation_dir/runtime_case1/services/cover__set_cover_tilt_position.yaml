domain: cover
service: set_cover_tilt_position
name: Set tilt position
description: Moves a cover tilt to a specific position.
fields:
  tilt_position:
    required: true
    name: Tilt position
    description: Target tilt positition.
    selector:
      number:
        min: 0
        max: 100
        unit_of_measurement: '%'
        step: 1
        mode: slider
target:
  entity:
  - domain:
    - cover
    supported_features:
    - 128
handler: builtin:service.not_implemented
supports_response: false
