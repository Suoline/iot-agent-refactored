domain: media_player
service: media_seek
name: Seek
description: Allows you to go to a different part of the media that is currently playing.
fields:
  seek_position:
    required: true
    name: Position
    description: Target position in the currently playing media. The format is platform
      dependent.
    selector:
      number:
        min: 0
        max: 9223372036854776000
        step: 0.01
        mode: box
target:
  entity:
  - domain:
    - media_player
    supported_features:
    - 2
handler: builtin:service.not_implemented
supports_response: false
