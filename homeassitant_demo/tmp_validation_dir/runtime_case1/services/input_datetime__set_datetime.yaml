domain: input_datetime
service: set_datetime
name: Set
description: Sets the date and/or time.
fields:
  date:
    required: false
    name: Date
    description: The target date.
    selector:
      text:
        multiline: false
        multiple: false
  time:
    required: false
    name: Time
    description: The target time.
    selector:
      time: {}
  datetime:
    required: false
    name: Date & time
    description: The target date & time.
    selector:
      text:
        multiline: false
        multiple: false
  timestamp:
    required: false
    name: Timestamp
    description: The target date & time, expressed by a UNIX timestamp.
    selector:
      number:
        min: 0
        max: 9223372036854776000
        mode: box
        step: 1
target:
  entity:
  - domain:
    - input_datetime
handler: builtin:service.not_implemented
supports_response: false
