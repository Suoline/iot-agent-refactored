domain: recorder
service: get_statistics
name: Get statistics
description: Retrieves statistics data for entities within a specific time period.
fields:
  start_time:
    required: true
    name: Start time
    description: The start time for the statistics query.
    selector:
      datetime: {}
  end_time:
    required: false
    name: End time
    description: The end time for the statistics query. If omitted, returns all statistics
      from start time onward.
    selector:
      datetime: {}
  statistic_ids:
    required: true
    name: Statistic IDs
    description: The entity IDs or statistic IDs to return statistics for.
    selector:
      statistic:
        multiple: true
  period:
    required: true
    name: Period
    description: The time period to group statistics by.
    selector:
      select:
        options:
        - 5minute
        - hour
        - day
        - week
        - month
        custom_value: false
        sort: false
        multiple: false
  types:
    required: true
    name: Types
    description: The types of statistics values to return.
    selector:
      select:
        options:
        - change
        - last_reset
        - max
        - mean
        - min
        - state
        - sum
        multiple: true
        custom_value: false
        sort: false
  units:
    required: false
    name: Units
    description: Optional unit conversion mapping.
    selector:
      object:
        multiple: false
target: null
handler: builtin:service.not_implemented
supports_response: false
