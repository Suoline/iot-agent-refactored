domain: humidifier
service: set_mode
name: Set mode
description: Sets the humidifier operation mode.
fields:
  mode:
    required: true
    name: Mode
    description: Operation mode. For example, "normal", "eco", or "away". For a list
      of possible values, refer to the integration documentation.
    selector:
      text:
        multiline: false
        multiple: false
target:
  entity:
  - domain:
    - humidifier
    supported_features:
    - 1
handler: builtin:service.not_implemented
supports_response: false
