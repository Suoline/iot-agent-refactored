domain: group
service: set
name: Set
description: Creates/Updates a group.
fields:
  object_id:
    required: true
    name: Object ID
    description: 'Object ID of this group. This object ID is used as part of the entity
      ID. Entity ID format: [domain].[object_id].'
    selector:
      text:
        multiline: false
        multiple: false
  name:
    required: false
    name: Name
    description: Name of the group.
    selector:
      text:
        multiline: false
        multiple: false
  icon:
    required: false
    name: Icon
    description: Name of the icon for the group.
    selector:
      icon: {}
  entities:
    required: false
    name: Entities
    description: List of all members in the group. Cannot be used in combination with
      `Add entities` or `Remove entities`.
    selector:
      entity:
        multiple: true
        reorder: false
  add_entities:
    required: false
    name: Add entities
    description: List of members to be added to the group. Cannot be used in combination
      with `Entities` or `Remove entities`.
    selector:
      entity:
        multiple: true
        reorder: false
  remove_entities:
    required: false
    name: Remove entities
    description: List of members to be removed from a group. Cannot be used in combination
      with `Entities` or `Add entities`.
    selector:
      entity:
        multiple: true
        reorder: false
  all:
    required: false
    name: All
    description: Enable this option if the group should only be used when all entities
      are in state `on`.
    selector:
      boolean: {}
target: null
handler: builtin:service.not_implemented
supports_response: false
