domain: water_heater
service: set_temperature
name: Set temperature
description: Sets the target temperature.
fields:
  temperature:
    required: true
    name: Temperature
    description: New target temperature for the water heater.
    selector:
      number:
        min: 0
        max: 100
        step: 0.5
        unit_of_measurement: °
        mode: slider
  operation_mode:
    required: false
    name: Operation mode
    description: New value of the operation mode. For a list of possible modes, refer
      to the integration documentation.
    selector:
      text:
        multiline: false
        multiple: false
target:
  entity:
  - domain:
    - water_heater
handler: builtin:service.not_implemented
supports_response: false
