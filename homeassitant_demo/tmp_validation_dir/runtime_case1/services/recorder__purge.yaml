domain: recorder
service: purge
name: Purge
description: Starts purge task - to clean up old data from your database.
fields:
  keep_days:
    required: false
    name: Days to keep
    description: Number of days to keep the data in the database. Starting today,
      counting backward. A value of `7` means that everything older than a week will
      be purged.
    selector:
      number:
        min: 0
        max: 365
        unit_of_measurement: days
        step: 1
        mode: slider
  repack:
    required: false
    name: Repack
    description: Attempt to save disk space by rewriting the entire database file.
    selector:
      boolean: {}
  apply_filter:
    required: false
    name: Apply filter
    description: Apply `entity_id` and `event_type` filters in addition to time-based
      purge.
    selector:
      boolean: {}
target: null
handler: builtin:service.not_implemented
supports_response: false
