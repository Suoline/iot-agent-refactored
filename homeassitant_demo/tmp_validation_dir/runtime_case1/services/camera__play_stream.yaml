domain: camera
service: play_stream
name: Play stream
description: Plays the camera stream on a supported media player.
fields:
  media_player:
    required: true
    name: Media player
    description: Media players to stream to.
    selector:
      entity:
        domain:
        - media_player
        reorder: false
        multiple: false
  format:
    required: false
    name: Format
    description: Stream format supported by the media player.
    selector:
      select:
        options:
        - hls
        custom_value: false
        sort: false
        multiple: false
target:
  entity:
  - domain:
    - camera
handler: builtin:service.not_implemented
supports_response: false
