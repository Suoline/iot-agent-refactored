- domain: homeassistant
  service: turn_on
  name: Generic turn on
  description: Generic action to turn devices on under any domain.
  target:
    entity:
      - {}
  handler: builtin:homeassistant.turn_on
- domain: homeassistant
  service: turn_off
  name: Generic turn off
  description: Generic action to turn devices off under any domain.
  target:
    entity:
      - {}
  handler: builtin:homeassistant.turn_off
- domain: homeassistant
  service: toggle
  name: Generic toggle
  description: Generic action to toggle devices on or off under any domain.
  target:
    entity:
      - {}
  handler: builtin:homeassistant.toggle
- domain: homeassistant
  service: update_entity
  name: Update entity
  description: Forces one or more entities to update their data.
  fields:
    entity_id:
      required: true
      name: Entities to update
      description: List of entities to force update.
      selector:
        entity:
          multiple: true
          reorder: false
  target:
    entity:
      - {}
  handler: builtin:homeassistant.update_entity
- domain: homeassistant
  service: save_persistent_states
  name: Save persistent states
  description: Persist runtime states immediately.
  handler: builtin:homeassistant.save_persistent_states
  supports_response: true
- domain: switch
  service: turn_on
