domain: media_player
service: join
name: Join
description: Groups media players together for synchronous playback. Only works on
  supported multiroom audio systems.
fields:
  group_members:
    required: true
    name: Group members
    description: The players which will be synced with the playback specified in 'Targets'.
    selector:
      entity:
        multiple: true
        domain:
        - media_player
        reorder: false
target:
  entity:
  - domain:
    - media_player
    supported_features:
    - 524288
handler: builtin:service.not_implemented
supports_response: false
