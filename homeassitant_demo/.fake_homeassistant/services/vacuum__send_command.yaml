domain: vacuum
service: send_command
name: Send command
description: Sends a command to the vacuum cleaner.
fields:
  command:
    required: true
    name: Command
    description: Command to execute. The commands are integration-specific.
    selector:
      text:
        multiline: false
        multiple: false
  params:
    required: false
    name: Parameters
    description: Parameters for the command. The parameters are integration-specific.
    selector:
      object:
        multiple: false
target:
  entity:
  - domain:
    - vacuum
handler: builtin:service.not_implemented
supports_response: false
