domain: tts
service: speak
name: Speak
description: Speaks something using text-to-speech on a media player.
fields:
  media_player_entity_id:
    required: true
    name: Media player entity
    description: Media players to play the message.
    selector:
      entity:
        domain:
        - media_player
        reorder: false
        multiple: false
  message:
    required: true
    name: Message
    description: The text you want to convert into speech so that you can listen to
      it on your device.
    selector:
      text:
        multiline: false
        multiple: false
  cache:
    required: false
    name: Cache
    description: Stores this message locally so that when the text is requested again,
      the output can be produced more quickly.
    selector:
      boolean: {}
  language:
    required: false
    name: Language
    description: Language to use for speech generation.
    selector:
      text:
        multiline: false
        multiple: false
  options:
    required: false
    name: Options
    description: A dictionary containing integration-specific options.
    selector:
      object:
        multiple: false
target:
  entity:
  - domain:
    - tts
handler: builtin:service.not_implemented
supports_response: false
