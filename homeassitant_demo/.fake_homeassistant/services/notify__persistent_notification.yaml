domain: notify
service: persistent_notification
name: Send a persistent notification
description: Sends a notification that is visible in the notifications panel.
fields:
  message:
    required: true
    name: Message
    description: Message body of the notification.
    selector:
      text:
        multiline: false
        multiple: false
  title:
    required: false
    name: Title
    description: Title of the notification.
    selector:
      text:
        multiline: false
        multiple: false
  data:
    required: false
    name: Data
    description: Some integrations provide extended functionality via this field.
      For more information, refer to the integration documentation.
    selector:
      object:
        multiple: false
target: null
handler: builtin:service.not_implemented
supports_response: false
