domain: media_player
service: search_media
name: Search media
description: Searches the available media.
fields:
  search_query:
    required: true
    name: Search query
    description: The term to search for.
    selector:
      text:
        multiline: false
        multiple: false
  media_content_type:
    required: false
    name: Content type
    description: The type of the content to browse, such as image, music, TV show,
      video, episode, channel, or playlist.
    selector:
      text:
        multiline: false
        multiple: false
  media_content_id:
    required: false
    name: Content ID
    description: The ID of the content to browse. Integration dependent.
    selector:
      text:
        multiline: false
        multiple: false
  media_filter_classes:
    required: false
    name: Media class filter
    description: List of media classes to filter the search results by.
    selector:
      text:
        multiple: true
        multiline: false
target:
  entity:
  - domain:
    - media_player
    supported_features:
    - 4194304
handler: builtin:service.not_implemented
supports_response: false
