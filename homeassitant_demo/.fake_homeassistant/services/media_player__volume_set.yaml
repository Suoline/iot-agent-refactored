domain: media_player
service: volume_set
name: Set volume
description: Sets the volume level.
fields:
  volume_level:
    required: true
    name: Level
    description: The volume. 0 is inaudible, 1 is the maximum volume.
    selector:
      number:
        min: 0
        max: 1
        step: 0.01
        mode: slider
target:
  entity:
  - domain:
    - media_player
    supported_features:
    - 4
handler: builtin:media_player.volume_set
supports_response: false
