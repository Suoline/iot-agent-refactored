domain: climate
service: set_temperature
name: Set target temperature
description: Sets the temperature setpoint.
fields:
  temperature:
    required: false
    name: Target temperature
    description: The temperature setpoint.
    selector:
      number:
        min: 0
        max: 250
        step: 0.1
        mode: box
  target_temp_high:
    required: false
    name: Upper target temperature
    description: The max temperature setpoint.
    selector:
      number:
        min: 0
        max: 250
        step: 0.1
        mode: box
  target_temp_low:
    required: false
    name: Lower target temperature
    description: The min temperature setpoint.
    selector:
      number:
        min: 0
        max: 250
        step: 0.1
        mode: box
  hvac_mode:
    required: false
    name: HVAC mode
    description: HVAC operation mode.
    selector:
      select:
        options:
        - 'off'
        - auto
        - cool
        - dry
        - fan_only
        - heat_cool
        - heat
        translation_key: hvac_mode
        custom_value: false
        sort: false
        multiple: false
target:
  entity:
  - domain:
    - climate
    supported_features:
    - 1
    - 2
handler: builtin:climate.set_temperature
supports_response: false
