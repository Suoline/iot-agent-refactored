domain: media_player
service: play_media
name: Play media
description: Starts playing specified media.
fields:
  media:
    required: true
    name: Media
    description: The media selected to play.
    selector:
      media: {}
  enqueue:
    required: false
    name: Enqueue
    description: If the content should be played now or be added to the queue.
    selector:
      select:
        options:
        - play
        - next
        - add
        - replace
        translation_key: enqueue
        custom_value: false
        sort: false
        multiple: false
  announce:
    required: false
    name: Announce
    description: If the media should be played as an announcement.
    selector:
      boolean: {}
target:
  entity:
  - domain:
    - media_player
    supported_features:
    - 512
handler: builtin:service.not_implemented
supports_response: false
