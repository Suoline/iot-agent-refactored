domain: fan
service: turn_on
name: Turn on
description: Turns fan on.
fields:
  percentage:
    required: false
    name: Percentage
    description: Speed of the fan.
    selector:
      number:
        min: 0
        max: 100
        unit_of_measurement: '%'
        step: 1
        mode: slider
  preset_mode:
    required: false
    name: Preset mode
    description: Preset fan mode.
    selector:
      text:
        multiline: false
        multiple: false
target:
  entity:
  - domain:
    - fan
    supported_features:
    - 32
handler: builtin:service.not_implemented
supports_response: false
