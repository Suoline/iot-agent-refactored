domain: camera
service: record
name: Record
description: Creates a recording of a live camera feed.
fields:
  filename:
    required: true
    name: Filename
    description: Full path to filename. Must be mp4.
    selector:
      text:
        multiline: false
        multiple: false
  duration:
    required: false
    name: Duration
    description: Planned duration of the recording. The actual duration may vary.
    selector:
      number:
        min: 1
        max: 3600
        unit_of_measurement: seconds
        step: 1
        mode: slider
  lookback:
    required: false
    name: Lookback
    description: Planned lookback period to include in the recording (in addition
      to the duration). Only available if there is currently an active HLS stream.
      The actual length of the lookback period may vary.
    selector:
      number:
        min: 0
        max: 300
        unit_of_measurement: seconds
        step: 1
        mode: slider
target:
  entity:
  - domain:
    - camera
handler: builtin:service.not_implemented
supports_response: false
