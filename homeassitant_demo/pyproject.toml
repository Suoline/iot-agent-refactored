[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fake-homeassistant-v2"
version = "0.1.0"
description = "Extensible Fake Home Assistant REST API simulator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "uvicorn>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.3.0,<9.0.0",
]

[project.scripts]
fake-ha = "fake_homeassistant_v2.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fake_homeassistant_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
